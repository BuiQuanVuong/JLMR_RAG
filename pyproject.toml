# Installs the dependencies and the `jmlr-rag` command (see README.md, "Installation").
# Install PyTorch FIRST if you have an NVIDIA GPU (pip would otherwise pull the CPU-only build):
#   https://pytorch.org/get-started/locally/
# then, inside a virtual environment in this folder:
#   pip install -e .            (add [dev] for the test tools: pip install -e ".[dev]")
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jmlr-rag"
version = "0.1.0"
description = "Local search, topic map and Claude-powered, citation-grounded Q&A over the Journal of Machine Learning Research archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "anthropic>=2.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "textual>=1.0",
    "nicegui>=4.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
jmlr-rag = "ask:main"

[tool.setuptools]
py-modules = ["ask", "boolq", "jmlr_dl", "update", "common", "compare", "conversation", "cite", "rewrite", "topics", "ui", "tui"]
packages = ["gui"]
