# Runs the test suites on every push and pull request, on Linux and Windows.
# The tests use a small synthetic dataset (tests/fixture.py, switched on by JMLR_TEST_FIXTURE=1) instead of
# the real multi-GB JMLR index, so CI downloads nothing from JMLR, needs no GPU and makes no Anthropic API calls.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    env:
      JMLR_TEST_FIXTURE: "1"          # tests build and use the synthetic dataset
      ANTHROPIC_API_KEY: dummy        # never used: all Claude calls are faked in the tests
      CUDA_VISIBLE_DEVICES: ""
      PYTHONIOENCODING: utf-8
      HF_HUB_OFFLINE: "1"             # no model downloads (the tests don't load models)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU-only PyTorch, then the project with test extras)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Compile every module
        run: python -m compileall -q .

      - name: Desktop app tests (NiceGUI)
        run: python -m pytest gui/ -q -p no:cacheprovider -p nicegui.testing.user_plugin -o asyncio_mode=auto -o main_file=

      - name: Terminal app test
        run: python tests/test_tui.py

      - name: Scholar-style query tests
        run: python tests/test_boolq.py
